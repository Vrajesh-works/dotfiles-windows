# herdr config. Linked to %APPDATA%\herdr by install.ps1.
# Defaults: herdr --default-config   Apply edits: herdr server reload-config
# Keys mirror tmux muscle memory.

[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+double_quote"
split_vertical   = "prefix+percent"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # copy-mode's own keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[terminal]
# Windows has no $SHELL; use PowerShell 7 so new panes load the dotfiles profile.
default_shell = "pwsh.exe"

[ui]
agent_panel_sort = "spaces"  # group agents by space
